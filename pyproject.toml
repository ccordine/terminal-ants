[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-ants"
version = "1.0.0"
description = "A persistent ASCII dirt box where ants build their own home"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
terminal-ants = "terminal_ants.__main__:main"

[tool.setuptools.packages.find]
include = ["terminal_ants*"]
